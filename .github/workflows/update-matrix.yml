name: Update Matrix README assets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "matrix.config.json"
      - "scripts/generate_matrix_assets.py"
      - "docs/**"
      - "tests/test_matrix_assets.py"
      - ".github/workflows/update-matrix.yml"
  push:
    paths:
      - "README.md"
      - "matrix.config.json"
      - "scripts/generate_matrix_assets.py"
      - "docs/**"
      - "tests/test_matrix_assets.py"
      - ".github/workflows/update-matrix.yml"

permissions:
  contents: read

concurrency:
  group: update-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MATRIX_SKIP_RASTER_PREVIEW: "1"
      MATRIX_SKIP_RASTER_FONT_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pillow
      - run: python scripts/generate_matrix_assets.py
      - run: python -m unittest tests/test_matrix_assets.py
      - run: node --check docs/js/matrix.js
      - name: Verify deterministic generated files are committed
        run: git diff --exit-code -- assets/matrix-profile.svg assets/open-live-version.svg docs/matrix.config.json docs/public-profile.json
