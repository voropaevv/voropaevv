name: Update Matrix README assets

on:
  workflow_dispatch:
  push:
    paths:
      - "matrix.config.json"
      - "scripts/generate_matrix_assets.py"
      - ".github/workflows/update-matrix.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install --upgrade pip pillow
      - run: python scripts/generate_matrix_assets.py
      - run: python -m unittest tests/test_matrix_assets.py
      - run: node --check docs/js/matrix.js
      - name: Commit updated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Matrix profile assets"
          file_pattern: assets/matrix-profile.svg assets/matrix-preview.png assets/open-live-version.svg docs/matrix.config.json docs/public-profile.json
